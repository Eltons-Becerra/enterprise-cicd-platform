services:
  python-api:
    container_name: enterprise-python-api
    build:
      context: ./backend-python
      dockerfile: Dockerfile
    image: enterprise-python-api:1.0.0
    environment:
      APP_NAME: Enterprise CI/CD Python API
      APP_VERSION: 1.0.0
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "${PYTHON_API_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/python/health')"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - enterprise-network

networks:
  enterprise-network:
    name: enterprise-network
    driver: bridge
