services:
  jenkins-controller:
    container_name: enterprise-jenkins-controller

    build:
      context: ./jenkins/controller
      dockerfile: Dockerfile

    image: enterprise-jenkins-controller:1.0.0

    environment:
      CASC_JENKINS_CONFIG: /var/jenkins_casc/jenkins.yaml
      JENKINS_AGENT_PRIVATE_KEY_PATH: /run/secrets/jenkins_agent_private_key
      GITHUB_CHECKOUT_PRIVATE_KEY_PATH: /run/secrets/github_checkout_private_key
      JENKINS_URL: "http://localhost:8081/"

    ports:
      - "${JENKINS_PORT}:8080"

    volumes:
      - jenkins-home:/var/jenkins_home
      - "D:/2026/enterprise-cicd-secrets/jenkins_agent_ed25519:/run/secrets/jenkins_agent_private_key:ro"
      - "D:/2026/enterprise-cicd-secrets/github_checkout_ed25519:/run/secrets/github_checkout_private_key:ro"

    restart: unless-stopped

    networks:
      - enterprise-network


  jenkins-java-agent:
    container_name: enterprise-jenkins-java-agent

    build:
      context: ./jenkins/agents/java
      dockerfile: Dockerfile

    image: enterprise-jenkins-java-agent:1.0.0

    environment:
      JENKINS_AGENT_SSH_PUBKEY: "${JENKINS_AGENT_SSH_PUBKEY}"

    expose:
      - "22"

    restart: unless-stopped

    networks:
      - enterprise-network


  jenkins-node-agent:
    container_name: enterprise-jenkins-node-agent

    build:
      context: ./jenkins/agents/node
      dockerfile: Dockerfile
      args:
        NODE_VERSION: "22.22.2"

    image: enterprise-jenkins-node-agent:1.0.0

    environment:
      JENKINS_AGENT_SSH_PUBKEY: "${JENKINS_AGENT_SSH_PUBKEY}"

    expose:
      - "22"

    restart: unless-stopped

    networks:
      - enterprise-network


  jenkins-python-agent:
    container_name: enterprise-jenkins-python-agent

    build:
      context: ./jenkins/agents/python
      dockerfile: Dockerfile

    image: enterprise-jenkins-python-agent:1.0.0

    environment:
      JENKINS_AGENT_SSH_PUBKEY: "${JENKINS_AGENT_SSH_PUBKEY}"

    expose:
      - "22"

    restart: unless-stopped

    networks:
      - enterprise-network


  gateway:
    container_name: enterprise-gateway

    build:
      context: ./nginx
      dockerfile: Dockerfile

    image: enterprise-gateway:1.0.0

    ports:
      - "${GATEWAY_PORT}:80"

    depends_on:
      frontend:
        condition: service_started
      java-api:
        condition: service_healthy
      python-api:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - enterprise-network


  frontend:
    container_name: enterprise-frontend

    build:
      context: ./frontend-react
      dockerfile: Dockerfile

    image: enterprise-frontend:1.0.0

    expose:
      - "80"

    depends_on:
      java-api:
        condition: service_healthy
      python-api:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - enterprise-network


  java-api:
    container_name: enterprise-java-api

    build:
      context: ./backend-java
      dockerfile: Dockerfile

    image: enterprise-java-api:1.0.0

    environment:
      APP_NAME: "Enterprise CI/CD Java API"
      APP_VERSION: "1.0.0"
      ENVIRONMENT: "${ENVIRONMENT}"
      PYTHON_API_URL: "${PYTHON_API_INTERNAL_URL}"
      SERVER_PORT: "8080"

    expose:
      - "8080"

    depends_on:
      python-api:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://localhost:8080/actuator/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    networks:
      - enterprise-network


  python-api:
    container_name: enterprise-python-api

    build:
      context: ./backend-python
      dockerfile: Dockerfile

    image: enterprise-python-api:1.0.0

    environment:
      APP_NAME: "Enterprise CI/CD Python API"
      APP_VERSION: "1.0.0"
      ENVIRONMENT: "${ENVIRONMENT}"

    expose:
      - "8000"

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/python/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    networks:
      - enterprise-network


networks:
  enterprise-network:
    name: enterprise-network
    driver: bridge

volumes:
  jenkins-home:
    name: enterprise-jenkins-home
