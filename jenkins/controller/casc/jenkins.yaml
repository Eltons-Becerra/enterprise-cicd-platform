jenkins:
  systemMessage: |
    Enterprise CI/CD Platform
    Jenkins Controller configured with Configuration as Code.

  numExecutors: 0
  mode: EXCLUSIVE
  scmCheckoutRetryCount: 2
  labelString: "controller"

  nodes:
    - permanent:
        name: "node-agent"
        remoteFS: "/home/jenkins/agent"
        numExecutors: 1
        mode: EXCLUSIVE
        labelString: "node22 npm frontend"
        retentionStrategy: "always"

        launcher:
          ssh:
            host: "jenkins-node-agent"
            port: 22
            credentialsId: "jenkins-agent-ssh"
            javaPath: ""
            jvmOptions: ""
            launchTimeoutSeconds: 60
            maxNumRetries: 10
            retryWaitTime: 15
            tcpNoDelay: true
            workDir: "/home/jenkins/agent"
            sshHostKeyVerificationStrategy:
              knownHostsFileKeyVerificationStrategy: {}

    - permanent:
        name: "python-agent"
        remoteFS: "/home/jenkins/agent"
        numExecutors: 1
        mode: EXCLUSIVE
        labelString: "python fastapi pytest"
        retentionStrategy: "always"

        launcher:
          ssh:
            host: "jenkins-python-agent"
            port: 22
            credentialsId: "jenkins-agent-ssh"
            javaPath: ""
            jvmOptions: ""
            launchTimeoutSeconds: 60
            maxNumRetries: 10
            retryWaitTime: 15
            tcpNoDelay: true
            workDir: "/home/jenkins/agent"
            sshHostKeyVerificationStrategy:
              knownHostsFileKeyVerificationStrategy: {}

    - permanent:
        name: "java-agent"
        remoteFS: "/home/jenkins/agent"
        numExecutors: 1
        mode: EXCLUSIVE
        labelString: "java17 maven"
        retentionStrategy: "always"

        launcher:
          ssh:
            host: "jenkins-java-agent"
            port: 22
            credentialsId: "jenkins-agent-ssh"
            javaPath: ""
            jvmOptions: ""
            launchTimeoutSeconds: 60
            maxNumRetries: 10
            retryWaitTime: 15
            tcpNoDelay: true
            workDir: "/home/jenkins/agent"
            sshHostKeyVerificationStrategy:
              knownHostsFileKeyVerificationStrategy: {}

credentials:
  system:
    domainCredentials:
      - credentials:
          - basicSSHUserPrivateKey:
              scope: SYSTEM
              id: "jenkins-agent-ssh"
              username: "jenkins"
              description: "SSH key used by Jenkins Controller to connect to build agents"
              privateKeySource:
                directEntry:
                  privateKey: "${readFile:${JENKINS_AGENT_PRIVATE_KEY_PATH}}"

          - basicSSHUserPrivateKey:
              scope: GLOBAL
              id: "github-checkout-ssh"
              username: "git"
              description: "Read-only SSH credential for GitHub checkout"
              privateKeySource:
                directEntry:
                  privateKey: "${readFile:${GITHUB_CHECKOUT_PRIVATE_KEY_PATH}}"

unclassified:
  location:
    url: "${JENKINS_URL}"
    adminAddress: "not configured <noreply@example.local>"
